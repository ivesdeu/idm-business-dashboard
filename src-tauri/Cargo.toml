[package]
name = "idm_business_dashboard"
version = "0.1.0"
description = "IDM Business Dashboard desktop app shell"
authors = ["IDM"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.1.1", features = [] }
tauri-plugin-deep-link = "2.0.2"
tauri-plugin-updater = "2.3.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

